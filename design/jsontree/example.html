                nodeBorderColor: document.getElementById('nodeBorderColor').value,

                fontSize: parseInt(document.getElementById('fontSize').value),

            };

        // Function to update visualization
        function updateVisualization() {
            const options = getCurrentOptions();
            const container = document.getElementById('json-tree');
            container.innerHTML = generateJSONTree(sampleTrainData, options);
        }

        // Function to reset to defaults
        function resetToDefaults() {
            document.getElementById('arrowColor').value = defaultOptions.arrowColor;
            document.getElementById('nodeBorderColor').value = defaultOptions.nodeBorderColor;
            document.getElementById('nodeBackgroundColor').value = defaultOptions.nodeBackgroundColor;

            document.getElementById('padding').value = defaultOptions.padding;
            document.getElementById('lineHeight').value = defaultOptions.lineHeight;
            document.getElementById('fontSize').value = defaultOptions.fontSize;
            updateVisualization();
        }

        // Initial visualization on page load
        window.addEventListener('DOMContentLoaded', function() {
            updateVisualization();
            initializeDragScroll();
        });

        // Drag-to-scroll functionality
        function initializeDragScroll() {
            const container = document.getElementById('json-tree');
            let isDown = false;
            let startX;
            let startY;
            let scrollLeft;
            let scrollTop;

            container.addEventListener('mousedown', (e) => {
                isDown = true;
                container.classList.add('dragging');
                startX = e.pageX - container.offsetLeft;
                startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
            });

            container.addEventListener('mouseleave', () => {
                isDown = false;
                container.classList.remove('dragging');
            });

            container.addEventListener('mouseup', () => {
                isDown = false;
                container.classList.remove('dragging');
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const y = e.pageY - container.offsetTop;
                const walkX = (x - startX) * 1.5; // Scroll speed multiplier
                const walkY = (y - startY) * 1.5;
                container.scrollLeft = scrollLeft - walkX;
                container.scrollTop = scrollTop - walkY;
            });
        }
