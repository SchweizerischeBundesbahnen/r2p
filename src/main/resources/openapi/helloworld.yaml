openapi: 3.0.3
info:
  title: R2P HelloWorld API
  version: 1.0.0
  description: API specification for the HelloWorld endpoint.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /helloworld:
    get:
      summary: Returns a friendly greeting.
      operationId: getHelloWorld
      tags:
        - HelloWorld
      responses:
        '200':
          description: Successful response containing the greeting message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloWorldResponse'
components:
  schemas:
    HelloWorldResponse:
      type: object
      properties:
        message:
          type: string
          description: Text returned to the caller.
      required:
        - message

