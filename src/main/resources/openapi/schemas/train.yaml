# ---------------------------------------------- TRAIN -------------------------------------------------------------------------------------
Train:
  description: >
    A train train (network slot) is SBB Infrastructure’s capacity object that grants the right to operate on the network
    for a particular route and time. It is maintained by the infrastructure manager and can change during planning.
    The train train is kept separate from the Train (the RU's operational plan); combining both makes transport operationally feasible.
  type: object
  required:
    - id
    - references
    - links
    - name
    - startdate
    - timestamp
    - journey
  properties:
    id:
      type: string
    references:
      type: array
      xml:
        name: references
        wrapped: true
      items:
        xml:
          name: reference
        $ref: '#/Reference'
    links:
      description: Links to other objects e.g. URL, documents in the same GitHub-Repository
      type: array
      xml:
        name: links
        wrapped: true
      items:
        xml:
          name: link
        $ref: '#/Link'
    name:
      description: The name of the train.
      type: string
      example: Train for oil traffic
    startdate:
      description: The startdate of the train.
      type: string
      format: date
    timestamp:
      description: The update time of the train.
      type: string
      format: date-time
    journey:
      description: The journey of the train.
      $ref: '#/Journey'
  xml:
    name: train
# ---------------------------------------------- REFERENCES -------------------------------------------------------------------------------------
Reference:
  description: 'The references of the object'
  type: object
  required:
    - type
    - name
  properties:
    type:
      description: type of the identifier
      $ref: '#/ReferenceType'
    startdate:
      description: startdate for the identifier
      type: string
      format: date
    name:
      description: name of the identifier
      type: string
      example: TR2185900000127853012025
  xml:
    name: reference
# ---------------------------------------------- LINKS -------------------------------------------------------------------------------------
Link:
  description: 'The links to the object'
  type: object
  required:
    - type
    - name
  properties:
    type:
      description: type of the link
      example: doc
      $ref: '#/LinkType'
    name:
      description: name of the identifier
      type: string
      example: train/to/other-file.json#/Attachment/MyDocument1.docx
  xml:
    name: link
# ---------------------------------------------- JOURNEY -------------------------------------------------------------------------------------
Journey:
  description: 'The journey of the object: a list of Journeylocation'
  type: object
  required:
    - journeylocations
  properties:
    journeylocations:
      type: array
      xml:
        name: journeylocations
        wrapped: false
      minItems: 2
      items:
        xml:
          name: journeylocation
        $ref: '#/Journeylocation'
  xml:
    name: journey
# ---------------------------------------------- JOURNEYLOCATION -------------------------------------------------------------------------------------
Journeylocation:
  description: 'A journeylocation of the journey'
  type: object
  required:
    - locations
    - activities
    - requirements
  properties:
    locations:
      type: array
      xml:
        name: locations
        wrapped: true
      minItems: 1
      items:
        xml:
          name: location
        $ref: '#/Location'
    activities:
      type: array
      xml:
        name: activities
        wrapped: true
      items:
        xml:
          name: activity
        $ref: '#/Activity'
    requirements:
      type: array
      xml:
        name: requirements
        wrapped: true
      items:
        xml:
          name: requirement
        $ref: "#/Requirement"
  xml:
    name: journeylocation
# ---------------------------------------------- ACTIVITY -------------------------------------------------------------------------------------
Activity:
  description: 'An activity either at the location or from this location to the next location'
  type: object
  required:
    - type
    - timings
    - responsibility
  properties:
    type:
      $ref: "#/ActivityType"
    timings:
      type: array
      xml:
        name: timings
        wrapped: true
      items:
        xml:
          name: timing
        $ref: '#/Timing'
    responsibility:
      $ref: '#/Responsability'
    alignment:
      $ref: '#/Alignment'
    capability:
      $ref: '#/Capability'
    requirement:
      $ref: '#/Requirement'
  xml:
    name: activity
# ---------------------------------------------- CAPABILITY -------------------------------------------------------------------------------------
Capability:
  description: A capability either at the location or from this location to the next specified location
  type: object
  oneOf:
    - required: [staff]
    - required: [rollingStock]
  required:
    - features
  properties:
    featuresets:
      type: array
      xml:
        name: featuresets
        wrapped: false
      items:
        xml:
          name: featurset
          $ref: '#/Featureset'
    features:
      type: array
      description: List of features assigned to this capability.
      xml:
        name: features
        wrapped: true
      items:
        $ref: '#/CapabilityFeature'
        xml:
          name: feature
    staff:
      type: array
      description: List of staff members associated with this capability.
      xml:
        name: staff
        wrapped: true
      items:
        $ref: '#/Staff'
        xml:
          name: person
    rollingStock:
      $ref: '#/RollingStock'
  xml:
    name: capability

# ---------------------------------------------- REQUIREMENT -------------------------------------------------------------------------------------
Requirement:
  description: 'A requirement either at the location or from this location to the next specified location'
  type: object
  required:
    - features
  properties:
    featuresets:
      type: array
      xml:
        name: featuresets
        wrapped: false
      items:
        xml:
          name: featurset
        $ref: '#/Featureset'
    features:
      type: array
      xml:
        name: features
        wrapped: false
      items:
        $ref: '#/RequirementFeature'
  xml:
    name: requirement
# ---------------------------------------------- FEATURESET -------------------------------------------------------------------------------------
Featureset:
  description: 'A featureset groups a bunch of features together'
  type: object
  required:
    - features
  properties:
    features:
      type: array
      items:
        $ref: '#/Feature'
  xml:
    name: featureset
# ---------------------------------------------- RESTRICTION -------------------------------------------------------------------------------------
Restriction:
  description: A restriction either at the location or from this location to the next location.
  type: object
  required:
    - type
    - creator
    - creationtime
  properties:
    type:
      type: string
      example: example
    restrictedvalue:
      type: integer
      format: int64
    creator:
      type: string
      example: example
    creationtime:
      type: string
      format: date-time
    starttime:
      type: string
      format: date-time
    endtime:
      type: string
      format: date-time
    freetext:
      type: string
      example: example
    resolution:
      type: string
      example: example
    resolutiontime:
      type: string
      format: date-time
  xml:
    name: restriction
# ---------------------------------------------- CONDITION -------------------------------------------------------------------------------------
Condition:
  description: A condition specifies the check to be applied between two featuresets.
  type: object
  properties:
    conditiontype:
      $ref: '#/ConditionType'
    comparetype:
      $ref: '#/CompareType'
    reference:
      type: string
      example: "250"
    mandatory:
      type: boolean
      example: true
  xml:
    name: condition
# ---------------------------------------------- WAGONGROUP -------------------------------------------------------------------------------------
WagonGroup:
  description: 'A wagon group either at the location or from this location on'
  type: object
  properties:
    id:
      type: string
      example: "123456789012"
    position:
      type: integer
      format: int32
      example: 1
    length:
      description: The length of the wagon group in millimetres.
      type: integer
      format: int64
      example: 27000
    weight:
      description: The weight of the wagon group in kilograms.
      type: integer
      format: int32
      example: 60000
    profile:
      type: string
      example: PN-5
    wagoncount:
      type: integer
      format: int32
      example: 5
    features:
      type: array
      xml:
        name: features
        wrapped: false
      items:
        $ref: '#/CapabilityFeature'
  xml:
    name: wagonGroup
# ---------------------------------------------- UNIT -------------------------------------------------------------------------------------
Unit:
  description: 'A unit of a wagon group'
  type: object
  required:
    - carbodies
  properties:
    position:
      type: integer
      format: int32
      example: 1
    carbodies:
      type: array
      xml:
        name: carbodies
        wrapped: true
      items:
        $ref: '#/Carbody'
        xml:
          name: carbody
    type:
      type: string
      example: Re420-CE
    features:
      type: array
      xml:
        name: features
        wrapped: false
      items:
        $ref: '#/CapabilityFeature'
  xml:
    name: unit
# ---------------------------------------------- CARBODY -------------------------------------------------------------------------------------
Carbody:
  description: 'A carbody from this location on'
  type: object
  required:
    - type
  properties:
    position:
      type: integer
      format: int32
      example: 1
    type:
      type: string
      example: RaBe
    traction:
      $ref: '#/TractionType'
    vehiclenumber:
      type: string
      example: "999999999962"
    frontcoupling:
      $ref: '#/CouplingType'
    backcoupling:
      $ref: '#/CouplingType'
    profile:
      type: string
      example: example
    features:
      type: array
      xml:
        name: features
        wrapped: false
      items:
        $ref: '#/CapabilityFeature'
  xml:
    name: carbody
# ---------------------------------------------- ROLLINGSTOCK ----------------------------------------------------------------------------
RollingStock:
  description: |
    TODO add descripiton
  type: object
  oneOf:
    - required: [wagonGroup]
    - required: [unit]
  properties:
    weight:
      description: |
        The sum of all weights of wagons and traction units in kilograms.
      type: integer
      format: int64
      example: 1284000
    length:
      description: |
        The calculated length of a train (sum of all length over buffer of the wagons and traction units) in millimetres.
      type: integer
      format: int64
      example: 415400
    maxSpeed:
      description: The max. possible speed of a train in km/h.
      type: integer
      format: int32
      example: 100
    brakingRatio:
      description: Minimum percentage of braking. Expressed as an integer value (no percent sign should be added).
      type: number
      format: float
      example: 115.0
    features:
      type: array
      xml:
        name: featuresets
        wrapped: false
      items:
        $ref: '#/CapabilityFeature'
    routeClass:
      description: >
        Indication of the route class (based on CEN EN 15528: line categories for managing the interface between 
        load limits of vehicles on infrastructure). All the codes in this code list refer to CEN EN 15528: line 
        categories for managing the interface between load limits of vehicles on infrastructure.
        CM2, CM3 and CM 4 equal M2, M3 and M4 which might be used in some legacy systems which only support two character codes.
      type: string
      example: 'B2'
    wagonGroups:
      type: array
      description: List of wagon groups associated with this capability.
      xml:
        name: wagonGroups
        wrapped: true
      items:
        $ref: '#/WagonGroup'
        xml:
          name: wagonGroup
    units:
      type: array
      description: List of units associated with this capability.
      xml:
        name: units
        wrapped: true
      items:
        $ref: '#/Unit'
        xml:
          name: unit
  xml:
    name: rollingStock
# ---------------------------------------------- FEATURE -------------------------------------------------------------------------------------
Feature:
  description: 'An abstract feature'
  type: object
  properties:
    type:
      type: string
      example: WIFI on board
    offeredservice:
      type: string
      example: example
    capacity:
      type: string
      example: "200"
  xml:
    name: feature
# ---------------------------------------------- CAPABILITYFEATURE -------------------------------------------------------------------------------------
CapabilityFeature:
  description: 'A feature of a capability'
  type: object
  properties:
    feature:
      $ref: '#/Feature'
    restriction:
      $ref: '#/Restriction'
  xml:
    name: capabilityfeature
# ---------------------------------------------- REQUIREMENTFEATURE -------------------------------------------------------------------------------------
RequirementFeature:
  description: 'A feature of a requirement'
  type: object
  properties:
    feature:
      $ref: '#/Feature'
    condition:
      $ref: '#/Condition'
  xml:
    name: requirementfeature
# ---------------------------------------------- STAFF -------------------------------------------------------------------------------------
Staff:
  description: 'A duty for a staff'
  type: object
  required:
    - type
    - action
  properties:
    type:
      type: string
      example: decouple
    action:
      type: string
      example: loco from wagongroup
    feature:
      $ref: '#/CapabilityFeature'
  xml:
    name: staff
# ---------------------------------------------- TIMING -------------------------------------------------------------------------------------
Timing:
  description: 'The timing for a location'
  type: object
  required:
    - type
    - time
    - offset
    - focus
  properties:
    type:
      $ref: '#/TimingType'
    time:
      type: string
      pattern: \d{2}:\d{2}:\d{2}
    offset:
      description: |
        The offset represents a duration in days from the starting point, start date. 
        To determine the actual absolute timestamp, add this duration to the start date converted to date-time.
      type: integer
      format: int32
    focus:
      $ref: '#/Focus'
    source:
      type: string
      example: 2187 oder R2P CompanyIdent
  xml:
    name: timing
# ---------------------------------------------- RESPONSABILITY -------------------------------------------------------------------------------------
Responsability:
  description: 'The responsability for a task'
  type: object
  required:
    - type
    - id
    - status
  properties:
    type:
      $ref: "#/ResponsabilityType"
    id:
      type: string
      example: ID-12-234-34-1
    status:
      $ref: '#/PlanStatus'
  xml:
    name: responsability
# ---------------------------------------------- ALIGNMENT -------------------------------------------------------------------------------------
Alignment:
  description: 'The alignment for a task'
  type: object
  required:
    - status
  properties:
    status:
      $ref: '#/PlanStatus'
  xml:
    name: alignment
# ---------------------------------------------- LOCATION -------------------------------------------------------------------------------------
Location:
  description: 'The location in the journey'
  type: object
  required:
    - type
    - code
    - name
  properties:
    type:
      $ref: "#/LocationType"
    typeCode:
      description: Used to specify the subtype of the location identifyer, e.g. type=SLC, typeCode='37' for a loading point.
      type: string
      example: '37'
    code:
      description: The id or code identifying of the location.
      type: string
      example: '1966700002'
    name:
      description: The name of the location.
      type: string
      example: 'FVL BielMett'
  xml:
    name: location
# ---------------------------------------------- API RESPONSE -------------------------------------------------------------------------------------
ApiResponse:
  type: object
  properties:
    code:
      type: integer
      format: int32
    type:
      type: string
    message:
      type: string
  xml:
    name: apiresponse
