# ---------------------------------------------- PATH -------------------------------------------------------------------------------------
Train:
  description: 'The train object'
  required:
    - id
    - references
    - name
    - startdate
    - timestamp
    - journey
  type: object
  properties:
    id:
      type: string
    references:
      type: array
      items:
        $ref: '#/Reference'
    links:
      description: Links to other objects e.g. URL, documents in the same GitHub-Repository
      type: array
      items:
        $ref: '#/Link'
    name:
      description: The name of the train.
      type: string
      example: Train for oil traffic
    startdate:
      description: The startdate of the train.
      type: string
      format: date
    timestamp:
      description: The update time of the train.
      type: string
      format: date-time
    journey:
      description: The journey of the train.
      $ref: '#/Journey'
  xml:
    name: train
# ---------------------------------------------- REFERENCES -------------------------------------------------------------------------------------
Reference:
  description: 'The references of the object'
  required:
    - type
    - name
  type: object
  properties:
    type:
      description: type of the identifier
      $ref: '#/ReferenceType'
    startdate:
      description: startdate for the identifier
      type: string
      format: date
    name:
      description: name of the identifier
      type: string
      example: TR2185900000127853012025
  xml:
    name: reference
# ---------------------------------------------- LINKS -------------------------------------------------------------------------------------
Link:
  description: 'The links to the object'
  required:
    - type
    - name
  type: object
  properties:
    type:
      description: type of the link
      example: doc
      $ref: '#/LinkType'
    name:
      description: name of the identifier
      type: string
      example: path_to/other-file.json#/Attachment/MyDocument1.docx
  xml:
    name: link
# ---------------------------------------------- JOURNEY -------------------------------------------------------------------------------------
Journey:
  description: 'The journey of the object: a list of Journeylocation'
  required:
    - journeylocations
  type: object
  properties:
    journeylocations:
      type: array
      minItems: 2
      items:
        $ref: '#/Journeylocation'
  xml:
    name: journey
# ---------------------------------------------- JOURNEYLOCATION -------------------------------------------------------------------------------------
Journeylocation:
  description: 'A journeylocation of the journey'
  required:
    - locations
    - activities
  type: object
  properties:
    locations:
      type: array
      minItems: 1
      items:
        $ref: '#/Location'
    activities:
      type: array
      items:
        $ref: '#/Activity'
  xml:
    name: journeylocation
# ---------------------------------------------- ACTIVITY -------------------------------------------------------------------------------------
Activity:
  description: 'An activity either at the location or from this location to the next specified location'
  required:
    - type
    - responsibility
  type: object
  properties:
    type:
      $ref: "#/ActivityType"
    timing:
      type: array
      items:
        $ref: '#/Timing'
    responsibility:
      $ref: '#/Responsability'
    alignment:
      $ref: '#/Alignment'
    capabilities:
      type: array
      items:
        $ref: '#/Capability'
    requirements:
      type: array
      items:
        $ref: '#/Requirement'
  xml:
    name: activity
# ---------------------------------------------- CAPABILITY -------------------------------------------------------------------------------------
Capability:
  description: 'A capability either at the location or from this location to the next specified location'
  required:
    - features
  type: object
  properties:
    features:
      type: array
      items:
        $ref: '#/Feature'
  xml:
    name: capability
# ---------------------------------------------- REQUIREMENT -------------------------------------------------------------------------------------
Requirement:
  description: 'A requirement either at the location or from this location to the next specified location'
  required:
    - features
  type: object
  properties:
    features:
      type: array
      items:
        $ref: '#/Feature'
    condition:
      type: array
      items:
        $ref: '#/Condition'
  xml:
    name: requirement
# ---------------------------------------------- RESTRICTION -------------------------------------------------------------------------------------
Restriction:
  description: 'A restriction either at the location or from this location to the next specified location'
  required:
    - type
    - creator
    - creationtime
  type: object
  properties:
    type:
      type: string
      example: example
    creator:
      type: string
      example: example
    creationtime:
      type: string
      format: date-time
    starttime:
      type: string
      format: date-time
    endtime:
      type: string
      format: date-time
    freetext:
      type: string
      example: example
    resolution:
      type: string
      example: example
    resolutiontime:
      type: string
      format: date-time
  xml:
    name: restriction
# ---------------------------------------------- CONDITION -------------------------------------------------------------------------------------
Condition:
  description: 'A condition specifies the check to be applied between two featuresets'
  required:
    - conditiontype
    - comparetype
    - reference
  type: object
  properties:
    conditiontype:
      type: array
      items:
        $ref: '#/ConditionType'
    comparetype:
      type: array
      items:
        $ref: '#/CompareType'
    reference:
      type: string
      example: 250
  xml:
    name: condition
# ---------------------------------------------- WAGONGROUP -------------------------------------------------------------------------------------
Wagongroup:
  description: 'A wagongroup either at the location or from this location on'
  required:
    - length
    - weight
  type: object
  properties:
    id:
      type: string
      example: 123456789012
    position:
      type: integer
      format: int32
      example: 1
    length:
      type: integer
      format: int32
      example: 27
    weight:
      type: integer
      format: int32
      example: 60000
    profile:
      type: string
      example: PN-5
    wagoncount:
      type: integer
      format: int32
      example: example
    features:
      type: array
      items:
        $ref: '#/Feature'
  xml:
    name: wagongroup
# ---------------------------------------------- UNIT -------------------------------------------------------------------------------------
Unit:
  description: 'A unit of a wagon group'
  required:
    - carbodies
  type: object
  properties:
    position:
      type: integer
      format: int32
      example: 4
    carbodies:
      type: array
      items:
        $ref: '#/Carbody'
    type:
      type: string
      example: Re420-CE
    features:
      type: array
      items:
        $ref: '#/Feature'
  xml:
    name: unit
# ---------------------------------------------- CARBODY -------------------------------------------------------------------------------------
Carbody:
  description: 'A carbody from this location on'
  required:
    - type
  type: object
  properties:
    position:
      type: integer
      format: int32
      example: 1
    type:
      type: string
      example: RaBe
    traction:
      $ref: '#/TractionType'
    vehiclenumber:
      type: string
      example: 999999999962
    frontcoupling:
      $ref: '#/CouplingType'
    backcoupling:
      $ref: '#/CouplingType'
    profile:
      type: string
      example: example
    features:
      type: array
      items:
        $ref: '#/Feature'
  xml:
    name: carbody
# ---------------------------------------------- FEATURE -------------------------------------------------------------------------------------
Feature:
  description: 'A feature of a capability or requirement'
  required:
    - type
  type: object
  properties:
    type:
      type: string
      example: WIFI on board
    offeredservice:
      type: string
      example: example
    capacity:
      type: string
      example: 200
    wagongroups:
      type: array
      items:
        $ref: '#/Wagongroup'
    units:
      type: array
      items:
        $ref: "#/Unit"
    staff:
      type: array
      items:
        $ref: '#/Staff'
    restrictions:
      type: array
      items:
        $ref: '#/Restriction'
  oneOf:
    - required: ["wagongroups"]
    - required: ["units"]
    - required: ["staff"]
  xml:
    name: feature
# ---------------------------------------------- STAFF -------------------------------------------------------------------------------------
Staff:
  description: 'A duty for a staff'
  required:
    - type
    - action
  type: object
  properties:
    type:
      type: string
      example: decouple
    action:
      type: string
      example: example
  xml:
    name: staff
# ---------------------------------------------- TIMING -------------------------------------------------------------------------------------
Timing:
  description: 'The timing for a location'
  required:
    - type
    - time
    - offset
    - focus
  type: object
  properties:
    type:
      $ref: '#/TimingType'
    time:
      type: string
      pattern: \d{2}:\d{2}:\d{2}
    offset:
      description: |
        The offset represents a duration in days from the starting point, start date. 
        To determine the actual absolute timestamp, add this duration to the start date converted to date-time.
      type: integer
      format: int32
    focus:
      $ref: '#/Focus'
    source:
      type: string
      example: 2187 oder R2P CompanyIdent
  xml:
    name: timing
# ---------------------------------------------- RESPONSABILITY -------------------------------------------------------------------------------------
Responsability:
  description: 'The responsability for a task'
  required:
    - type
    - id
    - status
  type: object
  properties:
    type:
      $ref: "#/ResponsabilityType"
    id:
      type: string
      example: ID-12-234-34-1
    status:
      $ref: '#/PlanStatus'
  xml:
    name: responsability
# ---------------------------------------------- ALIGNMENT -------------------------------------------------------------------------------------
Alignment:
  description: 'The alignment for a task'
  required:
    - status
  type: object
  properties:
    status:
      $ref: '#/PlanStatus'
  xml:
    name: alignment
# ---------------------------------------------- LOCATION -------------------------------------------------------------------------------------
Location:
  description: 'The location in the journey'
  required:
    - type
    - code
    - name
  type: object
  properties:
    type:
      type: string
      example: enum PLC, SLC, DIUM, UIC
    code:
      type: string
      example: 12345
    name:
      type: string
      example: Riom
  xml:
    name: alignment
# ---------------------------------------------- ENUM ReferenceType -------------------------------------------------------------------------------------
ReferenceType:
  type: string
  enum:
    - tttreftrain
    - tttroute
    - ttttrain
    - tttpathrequest
    - tttpath
    - tttcasereference
    - fpspath
    - fpsdebic
# ---------------------------------------------- ENUM ConditionType -------------------------------------------------------------------------------------
ConditionType:
  type: string
  enum:
    - eq
    - gt
    - lt
    - not
    - neq
    - lte
    - gte
    - regex
    - in
    - notIn
# ---------------------------------------------- ENUM CompareType -------------------------------------------------------------------------------------
CompareType:
  type: string
  enum:
    - string
    - number
# ---------------------------------------------- ENUM LinkType -------------------------------------------------------------------------------------
LinkType:
  type: string
  enum:
    - link
    - doc
# ---------------------------------------------- ENUM PLANSTATUS -------------------------------------------------------------------------------------
PlanStatus:
  type: string
  enum:
    - requested
    - confirmed
    - refused
    - dropped
    - proposed
# ---------------------------------------------- ENUM FOCUS -------------------------------------------------------------------------------------
Focus:
  type: string
  enum:
