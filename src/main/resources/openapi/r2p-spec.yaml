openapi: 3.0.3
info:
  title: R2P Train API
  version: 1.0.0
  description: API für Traffic-Objekte
servers:
  - url: http://localhost:8080
    description: Local Server

# Tag-Definition
tags:
  - name: R2P
    description: Trains Endpoints

paths:
  /v1/trains:
    get:
      tags:
        - R2P
      summary: List trains
      operationId: listTrains
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: operationalDayFrom
          in: query
          required: false
          description: 'optional filter: only trains at or after this operational day (inclusive)'
          schema:
            type: string
            format: date
        - name: operationalDayTo
          in: query
          required: false
          description: 'optional filter: only trains up to this operational day (inclusive)'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainListElement'
    post:
      tags:
        - R2P
      summary: Create train
      operationId: createTrain
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: comment
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/train.yaml#/Train'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
  /v1/trains/{trainId}/share:
    post:
      tags:
        - R2P
      summary: Share train
      operationId: shareTrain
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: shareWith
          in: query
          required: true
          description: Partner name to share the train with
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
  /v1/trains/{trainId}:
    get:
      tags:
        - R2P
      summary: Get train by ID
      operationId: getTrainById
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
  /v1/trains/{trainId}/{branchName}:
    get:
      tags:
        - R2P
      summary: Get train branch
      operationId: getTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
    put:
      tags:
        - R2P
      summary: Update train branch
      operationId: updateTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchName
          in: path
          required: true
          schema:
            type: string
        - name: comment
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/train.yaml#/Train'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
    delete:
      tags:
        - R2P
      summary: Delete train branch
      operationId: deleteTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchName
          in: path
          required: true
          schema:
            type: string
        - name: comment
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
  /v1/trains/versions/{version}:
    get:
      tags:
        - R2P
      summary: Get specific train version
      operationId: getTrainVersion
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: version
          in: path
          required: true
          description: the train version to get; note that the trainId is implied by the version and doesn't need to be provided explicitly
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: './schemas/train.yaml#/Train'
          description: Successful operation
  /v1/trains/{trainId}/changes:
    get:
      tags:
        - R2P
      summary: Get train changes by Id
      operationId: getTrainChangesById
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Change'
  /v1/trains/changes:
    get:
      tags:
        - R2P
      summary: List all train changes
      operationId: listTrainChanges
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Change'

components:
  schemas:
    TrainListElement:
      description: 'Summary information about a train when searching for or listing trains'
      type: object
      required:
        - trainId
        - mainTimestamp
        - branches
      properties:
        trainId:
          type: string
          format: uuid
        mainTimestamp:
          type: string
          format: date-time
        partners:
            type: array
            items:
              type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    BranchState:
      type: string
      enum:
        - open
        - merged
        - deleted
    Change:
      description: 'Change information'
      type: object
      required:
        - branchName
        - version
        - branchState
        - timestamp
      properties:
        branchName:
          type: string
          example: main
        version:
          type: string
          format: uuid
        branchState:
          $ref: '#/components/schemas/BranchState'
        timestamp:
          type: string
          format: date-time
        comment:
          type: string
          example: a useful comment
    Branch:
        description: 'The branch object'
        type: object
        required:
          - branchName
          - business
          - technical
        properties:
          branchName:
            type: string
            example: main
          business:
            $ref: '#/components/schemas/BranchBusinessData'
          technical:
            $ref: '#/components/schemas/BranchTechnicalData'
    BranchBusinessData:
      description: 'Branch business data'
      type: object
      required:
        - trainNumber
        - operationalDay
      properties:
        trainNumber:
          type: string
          example: IC 1234
        operationalDay:
          type: string
          format: date
    BranchTechnicalData:
      description: 'Branch technical data'
      type: object
      required:
        - version
        - branchState
        - timestamp
      properties:
        owner:
          type: string
          example: SOB
        version:
          type: string
          format: uuid
        branchState:
          $ref: '#/components/schemas/BranchState'
        timestamp:
          type: string
          format: date-time
        comment:
          type: string
          example: a useful comment
    PartnerToken:
      description: Represents an authentication token of a partner in the context of the PoC (to be replaced by a real authentication token later)
      type: string
      enum:
        - SBB
        - BLS
        - SOB
  securitySchemes:
    path_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://train.swagger.io/oauth/authorize
          scopes:
            write:train: modify train in your account
            read:train: read your train
    api_key:
      type: apiKey
      name: api_key
      in: header
