openapi: 3.0.3
info:
  title: R2P Train API
  version: 1.0.0
  description: API für Traffic-Objekte
servers:
  - url: http://localhost:8080
    description: Local Server

# Tag-Definition
tags:
  - name: R2P
    description: Trains Endpoints

paths:
  /v1/trains:
    get:
      tags:
        - R2P
      summary: List trains
      operationId: listTrains
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: operationalDayFrom
          in: query
          required: false
          description: 'optional filter: only trains at or after this operational day (inclusive)'
          schema:
            type: string
            format: date
        - name: operationalDayTo
          in: query
          required: false
          description: 'optional filter: only trains up to this operational day (inclusive)'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainListElement'
    post:
      tags:
        - R2P
      summary: Create train
      operationId: createTrain
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: comment
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/train.yaml#/Train'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
        '403':
          description: Not authorized to create train
  /v1/trains/{trainId}/unshare:
    post:
      tags:
        - R2P
      summary: Unshare train
      operationId: unshareTrain
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: unshareWith
          in: query
          required: true
          description: Partner name to unshare the train with
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
        '403':
          description: Not authorized to unshare train
        '404':
          description: Train not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/{trainId}/share:
    post:
      tags:
        - R2P
      summary: Share train
      operationId: shareTrain
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: shareWith
          in: query
          required: true
          description: Partner name to share the train with
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
        '403':
          description: Not authorized to share train
        '404':
          description: Train not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/{trainId}:
    get:
      tags:
        - R2P
      summary: Get train by ID
      operationId: getTrainById
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainListElement'
        '403':
          description: Not authorized to access train
        '404':
          description: Train not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/{trainId}/branches:
    post:
      tags:
        - R2P
      summary: Create a train branch
      operationId: createTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchName
          in: query
          schema:
            type: string
            example: myBranch
            maxLength: 255
        - name: comment
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/train.yaml#/Train'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          description: Not authorized to create train branch
        '404':
          description: Train not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/{trainId}/branches/{branchId}:
    get:
      tags:
        - R2P
      summary: Get train branch
      operationId: getTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          description: Not authorized to access train
        '404':
          description: Train or branch not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags:
        - R2P
      summary: Update train branch
      operationId: updateTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: comment
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/train.yaml#/Train'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          description: Not authorized to update train branch
        '404':
          description: Train or branch not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags:
        - R2P
      summary: Delete train branch
      operationId: deleteTrainBranch
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: comment
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '403':
          description: Not authorized to delete branch
        '404':
          description: Train or branch not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/versions/{version}:
    get:
      tags:
        - R2P
      summary: Get specific train version
      operationId: getTrainVersion
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: version
          in: path
          required: true
          description: the train version to get; note that the trainId is implied by the version and doesn't need to be provided explicitly
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: './schemas/train.yaml#/Train'
          description: Successful operation
        '403':
          description: Not authorized to access train
        '404':
          description: Train version not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/{trainId}/changes:
    get:
      tags:
        - R2P
      summary: Get train changes by Id
      operationId: getTrainChangesById
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: trainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: change timestamp from (inlusive)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: change timestamp to (inclusive)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Change'
        '403':
          description: Not authorized to access train
        '404':
          description: Train not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /v1/trains/changes:
    get:
      tags:
        - R2P
      summary: List all train changes
      operationId: listTrainChanges
      parameters:
        - name: token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/PartnerToken'
        - name: from
          in: query
          required: true
          description: change timestamp from (inlusive)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: change timestamp to (inlusive)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Change'

components:
  schemas:
    TrainListElement:
      description: 'Summary information about a train when searching for or listing trains'
      type: object
      required:
        - trainId
        - mainTimestamp
        - branches
      properties:
        trainId:
          type: string
          format: uuid
        mainTimestamp:
          type: string
          format: date-time
        partners:
            type: array
            items:
              type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    BranchState:
      type: string
      enum:
        - open
        - merged
        - deleted
    Action:
      type: string
      enum:
        - created
        - updated
        - merged
        - deleted
        - shared
        - unshared
    Change:
      description: 'Change information'
      type: object
      required:
        - action
        - partner
        - trainId
        - branchId
        - branchName
        - version
        - timestamp
      properties:
        action:
          $ref: '#/components/schemas/Action'
        partner:
          type: string
          description: partner that has performed this action
        concernedPartner:
          type: string
          description: partner that is concerned by this action (e.g. sharing or unsharing)
        trainId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
          example: SBB-main
          maxLength: 255
        version:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        comment:
          type: string
          example: a useful comment
    Branch:
        description: 'The branch object'
        type: object
        required:
          - branchId
          - branchName
          - business
          - technical
        properties:
          branchId:
            type: string
            format: uuid
          branchName:
            type: string
            example: SBB-main
            maxLength: 255
          business:
            $ref: '#/components/schemas/BranchBusinessData'
          technical:
            $ref: '#/components/schemas/BranchTechnicalData'
    BranchBusinessData:
      description: 'Branch business data'
      type: object
      required:
        - trainNumber
        - operationalDay
      properties:
        trainNumber:
          type: string
          example: IC 1234
        operationalDay:
          type: string
          format: date
    BranchTechnicalData:
      description: 'Branch technical data'
      type: object
      required:
        - version
        - branchState
        - timestamp
      properties:
        owner:
          type: string
          example: SOB
        version:
          type: string
          format: uuid
        branchState:
          $ref: '#/components/schemas/BranchState'
        timestamp:
          type: string
          format: date-time
        comment:
          type: string
          example: a useful comment
    PartnerToken:
      description: Represents an authentication token of a partner in the context of the PoC (to be replaced by a real authentication token later)
      type: string
      enum:
        - SBB
        - BLS
        - SOB
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          format: uri
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
      required:
        - title
        - status
  securitySchemes:
    path_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://train.swagger.io/oauth/authorize
          scopes:
            write:train: modify train in your account
            read:train: read your train
    api_key:
      type: apiKey
      name: api_key
      in: header
