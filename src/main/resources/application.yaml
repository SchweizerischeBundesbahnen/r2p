r2p:
  azure:
    client-id: "${R2P_AZURE_CLIENT_ID}"
    client-secret: "${R2P_AZURE_CLIENT_SECRET}"
    issuer-uri: "${R2P_AZURE_ISSUER_URI}"
  instance-owner: "${R2P_INSTANCE_OWNER}"
  flyway-clean-on-validation-error: "${FLYWAY_CLEAN_ON_VALIDATION_ERROR:false}"
  test-data:
    enabled: "${R2P_TEST_DATA_ENABLED:false}"
  cors:
    allowed-origins: "${R2P_CORS_ALLOWED_ORIGINS:http://localhost:4200}"
spring:
  application:
    name: r2p
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: "${r2p.azure.client-id}"
          issuer-uri: "${r2p.azure.issuer-uri}/v2.0"
      client:
        registration:
          azure:
            # Confidential client (Web) – requires a client-secret for the server-side
            # authorization code exchange. The Redirect URI must be registered as type "Web"
            # in Azure AD (not SPA), because the code exchange happens server-side.
            # PKCE is still used automatically by Spring Security for additional security.
            client-id: "${r2p.azure.client-id}"
            client-secret: "${r2p.azure.client-secret}"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          azure:
            issuer-uri: "${r2p.azure.issuer-uri}/v2.0"
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:${DATABASE_STORAGE:mem:r2p};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
springdoc:
  swagger-ui:
    oauth:
      client-id: "${r2p.azure.client-id}"
      use-pkce-with-authorization-code-grant: true
      scopes: api://${r2p.azure.client-id}/r2p

# uncomment to see more details about the requests
#logging:
  #level:
    # org.springframework.web: DEBUG

---
# ── Local development profile ─────────────────────────────────────────────────
# Uses a local Keycloak instance started automatically via Spring Docker Compose
# (compose.yaml). No Azure credentials required.
# Start with: mvn spring-boot:run "-Dspring-boot.run.profiles=local"
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # File-based H2 so data survives restarts during development
    url: jdbc:h2:file:./data/r2p-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/r2p
          audiences: r2p-client
      client:
        registration:
          azure:
            client-id: r2p-client
            client-secret: r2p-client-secret
            scope:
              - openid
              - profile
              - email
        provider:
          azure:
            issuer-uri: http://localhost:8180/realms/r2p
r2p:
  azure:
    client-id: r2p-client
    client-secret: r2p-client-secret
    issuer-uri: http://localhost:8180/realms/r2p
  instance-owner: SBB
  test-data:
    enabled: true
  openapi:
    auth-url: http://localhost:8180/realms/r2p/protocol/openid-connect/auth
    token-url: http://localhost:8180/realms/r2p/protocol/openid-connect/token
springdoc:
  swagger-ui:
    oauth:
      # r2p-spa is a public client (no secret), required for browser-based PKCE flows in Swagger UI.
      # r2p-client is confidential and would require a secret that the browser cannot safely provide.
      client-id: r2p-spa
      use-pkce-with-authorization-code-grant: true
      # r2p scope triggers the scp=r2p claim in the access token, which the backend requires.
      scopes: r2p

