r2p:
  azure:
    client-id: "${R2P_AZURE_CLIENT_ID:f5b54c65-e0b1-4233-bc60-bf4c59f399bd}"
    client-secret: "${R2P_AZURE_CLIENT_SECRET}"
    issuer-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a
  instance-owner: "${R2P_INSTANCE_OWNER:SBB}"
  flyway-clean-on-validation-error: "${FLYWAY_CLEAN_ON_VALIDATION_ERROR:false}"
  test-data:
    enabled: "${R2P_TEST_DATA_ENABLED:false}"
  cors:
    allowed-origins: "${R2P_CORS_ALLOWED_ORIGINS:http://localhost:4200}"
spring:
  application:
    name: r2p
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: "${r2p.azure.client-id}"
          issuer-uri: "${r2p.azure.issuer-uri}/v2.0"
      client:
        registration:
          azure:
            # Confidential client (Web) – requires a client-secret for the server-side
            # authorization code exchange. The Redirect URI must be registered as type "Web"
            # in Azure AD (not SPA), because the code exchange happens server-side.
            # PKCE is still used automatically by Spring Security for additional security.
            client-id: "${r2p.azure.client-id}"
            client-secret: "${r2p.azure.client-secret}"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          azure:
            issuer-uri: "${r2p.azure.issuer-uri}/v2.0"
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:${DATABASE_STORAGE:mem:r2p};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
springdoc:
  swagger-ui:
    oauth:
      # app registration: https://self.sbb-cloud.net/tools/appregistrations/app-registration-detail/f5b54c65-e0b1-4233-bc60-bf4c59f399bd
      client-id: "${r2p.azure.client-id}"
      use-pkce-with-authorization-code-grant: true
      scopes: api://${r2p.azure.client-id}/r2p

# uncomment to see more details about the requests
#logging:
  #level:
    # org.springframework.web: DEBUG
