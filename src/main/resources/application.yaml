r2p:
  azure:
    client-id: f5b54c65-e0b1-4233-bc60-bf4c59f399bd
    issuer-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a
spring:
  application:
    name: r2p
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: "${r2p.azure.client-id}"
          issuer-uri: "${r2p.azure.issuer-uri}/v2.0"
springdoc:
  swagger-ui:
    oauth:
      # app registration: https://self.sbb-cloud.net/tools/appregistrations/app-registration-detail/f5b54c65-e0b1-4233-bc60-bf4c59f399bd
      client-id: "${r2p.azure.client-id}"
      use-pkce-with-authorization-code-grant: true
      scopes: api://${r2p.azure.client-id}/r2p
