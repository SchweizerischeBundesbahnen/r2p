<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R²P Console – Sign-in failed</title>
    <link rel="icon" type="image/svg+xml" href="/img/r2p-mark.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <img src="/img/r2p-mark.svg" class="logo-tile" alt="R²P">
            <span class="wordmark">Console</span>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="empty-state">
                <div class="empty-state-text">Sign-in failed</div>
                <p class="empty-state-subtext">
                    The sign-in with your organisation account could not be completed.
                    Please try again. If the problem persists, contact the R²P operator
                    and state the time of your sign-in attempt.
                </p>
                <p>
                    <a class="btn btn-primary" href="/oauth2/authorization/azure">Sign in again</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
