<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Version - R2P</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Fill the full viewport and use a flex column layout ──────── */
        html, body {
            height: 100%;
            overflow: hidden;   /* page itself never scrolls */
        }

        body {
            padding: 0;         /* override style.css body padding */
            display: flex;
            flex-direction: column;
        }

        /* Outer wrapper fills all remaining height */
        #page-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: var(--spacing-md) var(--spacing-xl);
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            overflow: hidden;   /* children manage their own overflow */
        }

        /* The section containing toolbar + viewer grows to fill remaining space */
        .json-viewer-section {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;        /* grow, shrink, zero base so it respects flex math */
            min-height: 0;      /* required: allows flex children to shrink below content size */
            margin-bottom: 0;
        }

        /* ── JSON Viewer page-specific styles ─────────────────────────── */
        .json-viewer-toolbar {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            padding: var(--spacing-sm) var(--spacing-md);
            background-color: var(--card-background);
            border-bottom: 1px solid var(--border-color);
            border-radius: 8px 8px 0 0;
            flex-shrink: 0;     /* toolbar never shrinks */
        }

        .json-viewer-toolbar .toolbar-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .json-viewer-toolbar .search-input {
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-primary);
            background-color: white;
            min-width: 260px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .json-viewer-toolbar .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }

        .json-viewer-toolbar .search-input::placeholder {
            color: var(--text-muted);
        }

        .json-viewer-toolbar .toolbar-btn {
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: white;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .json-viewer-toolbar .toolbar-btn:hover:not(:disabled) {
            background-color: var(--background-color);
            border-color: var(--accent-color);
        }

        .json-viewer-toolbar .toolbar-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .json-viewer-toolbar .toolbar-btn:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .json-viewer-toolbar .search-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            min-width: 120px;
        }

        .json-viewer-toolbar .toolbar-separator {
            width: 1px;
            height: 1.5rem;
            background-color: var(--border-color);
            margin: 0 var(--spacing-xs);
        }

        /* The scrollable JSON area — fills all remaining height */
        .json-viewer-wrapper {
            flex: 1 1 0;
            min-height: 0;      /* allow shrinking below content size */
            overflow: auto;     /* scroll here, not on the page */
            background-color: var(--card-background);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            padding: var(--spacing-md) var(--spacing-lg);
        }

        /* pretty-json custom element theming */
        pretty-json {
            --key-color: #cc0000;
            --arrow-color: #737373;
            --brace-color: #0030f0;
            --bracket-color: #0030f0;
            --string-color: #009900;
            --number-color: #0000ff;
            --null-color: #666666;
            --boolean-color: #d23c91;
            --comma-color: #666666;
            --ellipsis-color: #666666;
            --indent: 1.5rem;
            --font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-size: 0.9rem;
        }

        @media (prefers-color-scheme: dark) {
            pretty-json {
                --key-color: #f73d3d;
                --arrow-color: #6c6c6c;
                --brace-color: #0690bc;
                --bracket-color: #0690bc;
                --string-color: #21c521;
                --number-color: #0078b3;
                --null-color: #8c8888;
                --boolean-color: #c737b3;
                --comma-color: #848181;
                --ellipsis-color: #c2c2c2;
            }

            .json-viewer-wrapper {
                background-color: #2d2d2d;
            }
        }


        /* Version meta info bar */
        .version-meta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            align-items: center;
            padding: var(--spacing-sm) var(--spacing-md);
            background-color: var(--background-color);
            border-radius: 8px;
            margin-bottom: var(--spacing-md);
            font-size: 0.875rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .version-meta .meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .version-meta .meta-label {
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .version-meta .meta-value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
        }

        /* Compact the header on this page to save vertical space */
        .header {
            flex-shrink: 0;
            margin-bottom: var(--spacing-sm);
        }

        .back-link {
            flex-shrink: 0;
            margin-bottom: var(--spacing-sm);
        }

        /* Loading / error states should not grow */
        .loading-state, .empty-state {
            flex-shrink: 0;
        }

        /* Main content area is a flex column that fills remaining height */
        #main-content {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
        }
    </style>
</head>
<body>
    <div id="page-root" x-data="trainVersionApp()" x-init="init()">

        <!-- Back Navigation -->
        <a :href="backUrl" class="back-link" tabindex="0">Back to Train Details</a>

        <!-- Header -->
        <header class="header compact-header" style="display:flex; align-items:center; gap:var(--spacing-md);">
            <div style="flex:1;">
                <h1 id="page-title" x-text="pageTitle">Train Version</h1>
                <p class="subtitle" x-show="pageSubtitle" x-text="pageSubtitle"></p>
            </div>
            <!-- Temporary partner/token switcher (PoC only) -->
            <div class="token-selector">
                <label for="token-select">Acting as:</label>
                <select id="token-select" class="token-select"
                        x-model="selectedToken"
                        @change="onTokenChange()">
                    <template x-for="t in partnerTokens" :key="t">
                        <option :value="t" :selected="t === selectedToken" x-text="t"></option>
                    </template>
                </select>
            </div>
        </header>

        <!-- Loading State -->
        <div class="loading-state" x-show="loading"
             style="text-align: center; padding: 2rem; color: var(--text-muted);">
            Loading train version…
        </div>

        <!-- Error State -->
        <div x-show="!loading && !!error" class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">Could not load train version</div>
            <div class="empty-state-subtext" x-text="error"></div>
        </div>

        <!-- Main Content: flex column, fills all remaining height -->
        <div id="main-content" x-show="!loading && !error && !!trainData">

            <!-- Version meta bar -->
            <div class="version-meta">
                <div class="meta-item" x-show="branchName">
                    <span class="meta-label">Branch</span>
                    <span class="meta-value" x-text="branchName"></span>
                </div>
                <div class="meta-item" x-show="versionId">
                    <span class="meta-label">Version ID</span>
                    <span class="meta-value id-cell">
                        <span class="id-truncated" :title="versionId"
                              x-text="versionId && truncateId(versionId)"></span>
                        <button class="clipboard-btn" @click="copyToClipboard(versionId)"
                                aria-label="Copy version ID" title="Copy full ID">📋</button>
                    </span>
                </div>
                <div class="meta-item" x-show="trainNumber">
                    <span class="meta-label">Train</span>
                    <span class="meta-value" x-text="trainNumber"></span>
                </div>
                <div class="meta-item" x-show="operationalDay">
                    <span class="meta-label">Operational Day</span>
                    <span class="meta-value" x-text="operationalDay && formatDate(operationalDay)"></span>
                </div>
                <div class="meta-item" style="margin-left: auto;">
                    <button class="button button-secondary" @click="copyToClipboard(jsonString)"
                            title="Copy raw JSON to clipboard">📋 Copy JSON</button>
                </div>
            </div>

            <!-- JSON Viewer Card: flex column filling remaining height -->
            <div class="json-viewer-section">
                <!-- Toolbar: search + expand/collapse — always visible -->
                <div class="json-viewer-toolbar">
                    <div class="toolbar-group">
                        <input type="search"
                               class="search-input"
                               placeholder="Search in JSON…"
                               x-model="searchQuery"
                               @keydown.enter.prevent="searchResults.length ? searchNext() : doSearch()"
                               @input.debounce.400ms="doSearch()"
                               aria-label="Search in JSON">
                        <button class="toolbar-btn" @click="doSearch()"
                                title="Find first match">🔍 Search</button>
                        <button class="toolbar-btn"
                                :disabled="searchResults.length === 0"
                                @click="searchPrev()"
                                aria-label="Previous match"
                                title="Previous match">‹ Prev</button>
                        <button class="toolbar-btn"
                                :disabled="searchResults.length === 0"
                                @click="searchNext()"
                                aria-label="Next match"
                                title="Next match">Next ›</button>
                        <span class="search-status" x-text="searchStatus" aria-live="polite"></span>
                    </div>

                    <div class="toolbar-separator"></div>

                    <div class="toolbar-group">
                        <button class="toolbar-btn" @click="expandAll()"
                                title="Expand all JSON nodes">⊞ Expand all</button>
                        <button class="toolbar-btn" @click="collapseAll()"
                                title="Collapse all JSON nodes">⊟ Collapse all</button>
                    </div>
                </div>

                <!-- JSON Viewer: scrollable, fills all remaining height -->
                <div class="json-viewer-wrapper" id="json-viewer"></div>
            </div>

        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast" style="display: none;"></div>

    <!-- Scripts -->
    <script src="/js/r2p-utils.js"></script>
    <script src="/js/r2p-api.js"></script>
    <script src="/js/pretty-json.js"></script>
    <script src="/js/app-train-version.js"></script>
    <script defer src="/webjars/alpinejs/dist/cdn.min.js"></script>
</body>
</html>
