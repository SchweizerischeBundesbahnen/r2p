name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.R2P_APP_ID }}
          private-key: ${{ secrets.R2P_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
        # Note: Configuration is managed via release-please-config.json
        # and .release-please-manifest.json files

      - name: Checkout release-please branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        if: ${{ steps.release.outputs.pr }}
        run: chmod +x ./mvnw

      - name: Generate THIRD-PARTY.txt
        if: ${{ steps.release.outputs.pr }}
        run: ./mvnw license:add-third-party

      - name: Commit and push THIRD-PARTY.txt if changed
        if: ${{ steps.release.outputs.pr }}
        run: |
          if ! git diff --quiet THIRD-PARTY.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add THIRD-PARTY.txt
            git commit -m "chore: update THIRD-PARTY.txt"
            git push
          else
            echo "THIRD-PARTY.txt unchanged, skipping commit."
          fi

  # Build for Linux
  build-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven including native image
        run: ./mvnw clean package -Papp-image-unix

      - name: Create Linux archive
        run: |
          mkdir -p dist-archives
          cd target/dist
          tar -czf ../../dist-archives/r2p-linux.tar.gz *
          cd ../..

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-linux.tar.gz

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/docs/

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: target/surefire-reports/

  # Build for Windows
  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven including native image
        run: .\mvnw.cmd clean package -Papp-image-windows

      - name: Create Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-archives
          Compress-Archive -Path target/dist/* -DestinationPath dist-archives/r2p-windows.zip

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-windows.zip

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: target/surefire-reports/

  # Build for macOS
  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven including native image
        run: ./mvnw clean package -Papp-image-mac

      - name: Create macOS archive
        run: |
          mkdir -p dist-archives
          cd target/dist
          tar -czf ../../dist-archives/r2p-macos.tar.gz *
          cd ../..

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-macos.tar.gz

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: target/surefire-reports/

  # Combine and upload documentation and test results
  upload-docs-and-tests:
    needs: [release-please, build-linux, build-windows, build-macos]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: artifacts/documentation

      - name: Download test results (Linux)
        uses: actions/download-artifact@v8
        with:
          name: test-results-linux
          path: artifacts/test-results-linux

      - name: Download test results (Windows)
        uses: actions/download-artifact@v8
        with:
          name: test-results-windows
          path: artifacts/test-results-windows

      - name: Download test results (macOS)
        uses: actions/download-artifact@v8
        with:
          name: test-results-macos
          path: artifacts/test-results-macos

      - name: Create documentation archive
        run: |
          cd artifacts/documentation
          zip -r ../r2p-documentation.zip *
          cd ../..

      - name: Create combined test results archive
        run: |
          mkdir -p artifacts/combined-test-results
          cp -r artifacts/test-results-linux/* artifacts/combined-test-results/ 2>/dev/null || true
          cp -r artifacts/test-results-windows/* artifacts/combined-test-results/ 2>/dev/null || true
          cp -r artifacts/test-results-macos/* artifacts/combined-test-results/ 2>/dev/null || true
          cd artifacts/combined-test-results
          zip -r ../r2p-test-results.zip *
          cd ../..

      - name: Upload documentation and test results to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} artifacts/r2p-documentation.zip
          gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} artifacts/documentation/r2p-api.html
          gh release upload --clobber ${{ needs.release-please.outputs.tag_name }} artifacts/r2p-test-results.zip

  # Build and push Docker image using Spring Boot buildpacks
  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with Spring Boot
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ./mvnw spring-boot:build-image \
            -Dspring-boot.build-image.imageName=ghcr.io/${REPO_LOWERCASE}:${VERSION} \
            -DskipTests

      - name: Tag and push Docker images
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
        run: |
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          MAJOR_MINOR="${MAJOR}.${MINOR}"
          # Tag with additional version tags
          docker tag ghcr.io/${REPO_LOWERCASE}:${VERSION} ghcr.io/${REPO_LOWERCASE}:${MAJOR_MINOR}
          docker tag ghcr.io/${REPO_LOWERCASE}:${VERSION} ghcr.io/${REPO_LOWERCASE}:${MAJOR}
          docker tag ghcr.io/${REPO_LOWERCASE}:${VERSION} ghcr.io/${REPO_LOWERCASE}:latest
          # Push all tags
          docker push ghcr.io/${REPO_LOWERCASE}:${VERSION}
          docker push ghcr.io/${REPO_LOWERCASE}:${MAJOR_MINOR}
          docker push ghcr.io/${REPO_LOWERCASE}:${MAJOR}
          docker push ghcr.io/${REPO_LOWERCASE}:latest
