name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Use PAT to trigger other workflows (automerge)
          # If RELEASE_PLEASE_TOKEN is not set, falls back to GITHUB_TOKEN
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        # Note: Configuration is managed via release-please-config.json
        # and .release-please-manifest.json files

  # Build for Linux
  build-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven including native image
        run: mvn clean package -Papp-image-unix

      - name: Create Linux archive
        run: |
          mkdir -p dist-archives
          cd target/dist
          tar -czf ../../dist-archives/r2p-linux.tar.gz *
          cd ../..

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-linux.tar.gz

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: target/docs/

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results-linux
          path: target/surefire-reports/

  # Build for Windows
  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven including native image
        run: mvn clean package -Papp-image-windows

      - name: Create Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-archives
          Compress-Archive -Path target/dist/* -DestinationPath dist-archives/r2p-windows.zip

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-windows.zip

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results-windows
          path: target/surefire-reports/

  # Build for macOS
  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven including native image
        run: mvn clean package -Papp-image-mac

      - name: Create macOS archive
        run: |
          mkdir -p dist-archives
          cd target/dist
          tar -czf ../../dist-archives/r2p-macos.tar.gz *
          cd ../..

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist-archives/r2p-macos.tar.gz

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results-macos
          path: target/surefire-reports/

  # Combine and upload documentation and test results
  upload-docs-and-tests:
    needs: [release-please, build-linux, build-windows, build-macos]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download documentation artifact
        uses: actions/download-artifact@v7
        with:
          name: documentation
          path: artifacts/documentation

      - name: Download test results (Linux)
        uses: actions/download-artifact@v7
        with:
          name: test-results-linux
          path: artifacts/test-results-linux

      - name: Download test results (Windows)
        uses: actions/download-artifact@v7
        with:
          name: test-results-windows
          path: artifacts/test-results-windows

      - name: Download test results (macOS)
        uses: actions/download-artifact@v7
        with:
          name: test-results-macos
          path: artifacts/test-results-macos

      - name: Create documentation archive
        run: |
          cd artifacts/documentation
          zip -r ../r2p-documentation.zip *
          cd ../..

      - name: Create combined test results archive
        run: |
          mkdir -p artifacts/combined-test-results
          cp -r artifacts/test-results-linux/* artifacts/combined-test-results/ 2>/dev/null || true
          cp -r artifacts/test-results-windows/* artifacts/combined-test-results/ 2>/dev/null || true
          cp -r artifacts/test-results-macos/* artifacts/combined-test-results/ 2>/dev/null || true
          cd artifacts/combined-test-results
          zip -r ../r2p-test-results.zip *
          cd ../..

      - name: Upload documentation and test results to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} artifacts/r2p-documentation.zip
          gh release upload ${{ needs.release-please.outputs.tag_name }} artifacts/r2p-test-results.zip

  # Build and push Docker image using Spring Boot buildpacks
  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT

      - name: Build and push Docker image with Spring Boot
        run: |
          mvn spring-boot:build-image \
            -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} \
            -Dspring-boot.build-image.publish=true

      - name: Tag and push additional versions
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major_minor }}
          docker tag ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }}
          docker tag ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major_minor }}
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }}
          docker push ghcr.io/${{ github.repository }}:latest
