name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate OpenAPI with Spectral
        run: |
          npm install -g @stoplight/spectral-cli
          echo "=== Spectral Lint Results ==="
          spectral lint src/main/resources/openapi/r2p-spec.yaml --ruleset .spectral.yaml --format stylish --output spectral-report.txt && SPECTRAL_EXIT=0 || SPECTRAL_EXIT=$?
          spectral lint src/main/resources/openapi/r2p-spec.yaml --ruleset .spectral.yaml --format html --output spectral-report.html || true
          cat spectral-report.txt || echo "No issues found"
          if [ $SPECTRAL_EXIT -ne 0 ]; then
            echo "❌ OpenAPI specification has errors!"
            exit $SPECTRAL_EXIT
          fi
          echo "✅ OpenAPI specification is valid!"

      - name: Upload Spectral Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spectral-reports
          path: |
            spectral-report.txt
            spectral-report.html

  build:
    needs: validate-openapi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload documentation
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: target/docs/

