version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      time: "14:00"
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      time: "14:00"
    open-pull-requests-limit: 10
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      time: "14:00"
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "14:00"
    open-pull-requests-limit: 10